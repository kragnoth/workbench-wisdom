plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.115'
}

// Every build that makes a jar (build, jar, assemble) bumps mod_version in gradle.properties by one: 2.0.0 -> 2.0.1.
// Each place rolls over at 10 into the next: 2.0.9 -> 2.1.0, 2.9.9 -> 3.0.0. The jar and the version the game shows
// both use it.
def modVersion = mod_version
if (gradle.startParameter.taskNames.any { def t = it.toLowerCase(); t.endsWith('build') || t.endsWith('jar') || t.endsWith('assemble') }) {
    def parts = modVersion.tokenize('.').collect { it.toInteger() }
    while (parts.size() < 3) {
        parts << 0
    }
    parts[2]++
    if (parts[2] >= 10) {
        parts[2] = 0
        parts[1]++
    }
    if (parts[1] >= 10) {
        parts[1] = 0
        parts[0]++
    }
    modVersion = parts.join('.')
    def props = file('gradle.properties')
    props.text = props.text.replaceFirst(/(?m)^mod_version=.*$/, "mod_version=${modVersion}")
}
version = modVersion
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        // ./gradlew runGameTestServer: runs the GameTests in com.kragnoth.workbenchwisdom.gametest and exits
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// JEI (optional): the Reforging Bench's recipe categories. compileOnly, so it's never shipped or required.
repositories {
    maven {
        url = 'https://maven.blamejared.com/'
        content { includeGroup 'mezz.jei' }
    }
}

dependencies {
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : version.toString(),
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Ship the license inside the jar, and clear out older builds' jars so build/libs holds only the newest.
jar {
    from("LICENSE")
    doFirst {
        delete fileTree(destinationDirectory) { include "${mod_id}-*.jar" }
    }
}
